{% extends 'hrms/base.html' %}
{% load static %}

{% block title %}Delhi Office Attendance Kiosk{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 520px; border-radius: 16px; overflow: hidden;">
        <div class="card-header bg-dark text-white text-center py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-tablet me-2"></i>Office Reception Kiosk</h5>
            <small class="text-white-50">Look at the camera and tap to Punch In / Punch Out</small>
        </div>

        <div class="card-body p-4 text-center">
            <!-- Viewfinder -->
            <div class="position-relative bg-black rounded-4 overflow-hidden mb-3" style="height: 330px;">
                <video id="kioskVideo" autoplay playsinline class="w-100 h-100" style="object-fit: cover;"></video>
                <canvas id="kioskCanvas" style="display: none;"></canvas>
            </div>

            <!-- Status Box -->
            <div id="kioskStatus" class="alert d-none py-2 fw-semibold" style="font-size: 14px;"></div>

            <!-- Action Button -->
            <button id="scanBtn" class="btn btn-primary btn-lg w-100 fw-bold py-2 rounded-pill shadow-sm" onclick="scanFace()">
                <i class="bi bi-camera-fill me-2"></i>Scan Face (Punch In / Out)
            </button>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('kioskVideo');
const canvas = document.getElementById('kioskCanvas');
const statusBox = document.getElementById('kioskStatus');
const scanBtn = document.getElementById('scanBtn');

// Initialize camera feed
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 } })
    .then(stream => {
        video.srcObject = stream;
    })
    .catch(err => {
        statusBox.className = 'alert alert-danger py-2';
        statusBox.innerText = 'Camera access blocked. Please allow browser camera access.';
        statusBox.classList.remove('d-none');
        scanBtn.disabled = true;
    });

function scanFace() {
    scanBtn.disabled = true;
    statusBox.className = 'alert alert-info py-2';
    statusBox.innerText = 'Capturing & Verifying...';
    statusBox.classList.remove('d-none');

    // Freeze snapshot at 400x400 for sub-second network transfer
    canvas.width = 400;
    canvas.height = 400;
    canvas.getContext('2d').drawImage(video, 0, 0, 400, 400);

    canvas.toBlob(async blob => {
        const formData = new FormData();
        formData.append('punch_photo', blob, 'kiosk_frame.jpg');

        try {
            const res = await fetch('{% url "hrms:api_kiosk_punch" %}', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            if (res.ok) {
                const isPunchIn = data.action === "Punch In";
                statusBox.className = isPunchIn ? 'alert alert-success py-2' : 'alert alert-warning py-2';
                statusBox.innerHTML = `<strong>${data.employee_name}</strong>: ${data.action} at ${data.time}`;
            } else {
                statusBox.className = 'alert alert-danger py-2';
                statusBox.innerText = data.error || 'Face not recognized.';
            }
        } catch (e) {
            statusBox.className = 'alert alert-danger py-2';
            statusBox.innerText = 'Server error. Please try again.';
        } finally {
            // Reset for the next person after 3 seconds
            setTimeout(() => {
                scanBtn.disabled = false;
                statusBox.classList.add('d-none');
            }, 3000);
        }
    }, 'image/jpeg', 0.85);
}
</script>
{% endblock %}

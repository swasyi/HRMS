{% extends "hrms/base.html" %}
{% block title %}Delete Recruitment Stage{% endblock %}

{% block content %}
<h4 class="mb-3">Delete "{{ object.name }}"?</h4>
<p class="text-muted">This stage will be removed from any job pipelines it's part of. This cannot be undone.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, delete</button>
  <a href="{% url 'hrms:recruitmentstage_list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
